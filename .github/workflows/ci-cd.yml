name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Cinema.sln

    - name: Build
      run: dotnet build Cinema.sln --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Cinema.sln

    - name: Run Unit Tests
      run: |
        dotnet test tests/Cinema.Domain.UnitTests/Cinema.Domain.UnitTests.csproj --configuration Release --no-restore --verbosity normal --logger trx --results-directory TestResults
        dotnet test tests/Cinema.Application.UnitTests/Cinema.Application.UnitTests.csproj --configuration Release --no-restore --verbosity normal --logger trx --results-directory TestResults
        dotnet test tests/Cinema.Infrastructure.UnitTests/Cinema.Infrastructure.UnitTests.csproj --configuration Release --no-restore --verbosity normal --logger trx --results-directory TestResults
        dotnet test tests/Cinema.MasterNode.UnitTests/Cinema.MasterNode.UnitTests.csproj --configuration Release --no-restore --verbosity normal --logger trx --results-directory TestResults

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Cinema.sln

    - name: Check formatting
      run: dotnet format Cinema.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true

  docker-build:
    name: Docker · ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build, test]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # required to publish to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: ./Dockerfile
          - name: gateway
            dockerfile: ./Dockerfile.gateway
          - name: grpc
            dockerfile: ./Dockerfile.grpc
          - name: loadbalancer
            dockerfile: ./Dockerfile.loadbalancer
          - name: masternode
            dockerfile: ./Dockerfile.masternode
          - name: readservice
            dockerfile: ./Dockerfile.readservice

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # ghcr.io rejects uppercase paths, and github.repository preserves the
    # owner's casing — lowercase it before using it as an image name.
    - name: Resolve image name
      id: image
      run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tags and labels
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.ref }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    # Pull requests build but do not publish, so a fork cannot push a package.
    - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,scope=${{ matrix.name }},mode=max
